
  spring:
    datasource:
      url: jdbc:postgresql://localhost:5434/docqora
      username: postgres
      password: ${DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          format_sql: true

    #  ai:
